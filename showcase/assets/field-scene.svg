<svg xmlns="http://www.w3.org/2000/svg" width="720" height="545" viewBox="0 0 720 545" role="img" aria-labelledby="title desc">
  <title id="title">Ночной осмотр телекоммуникационного шкафа в Москве</title>
  <desc id="desc">Изометрический макет. Уличный двухдверный шкаф стоит на бетонном основании над кабельными каналами. Рядом фонарь и ограждение, вдали виден силуэт московской высотки.</desc>
  <defs>
    <linearGradient id="night" x2=".95" y2=".9"><stop stop-color="#0B2B50"/><stop offset=".57" stop-color="#143D65"/><stop offset="1" stop-color="#0B2B50"/></linearGradient>
    <radialGradient id="haze"><stop stop-color="#4486A5" stop-opacity=".42"/><stop offset="1" stop-color="#4486A5" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampHalo"><stop stop-color="#FFDE9B" stop-opacity=".85"/><stop offset=".18" stop-color="#FFC789" stop-opacity=".32"/><stop offset="1" stop-color="#F8AD62" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#FFCD8E" stop-opacity=".14"/><stop offset=".8" stop-color="#FFCD8E" stop-opacity="0"/></linearGradient>
    <linearGradient id="asphalt" x2=".78" y2="1"><stop stop-color="#456686"/><stop offset=".55" stop-color="#294A6C"/><stop offset="1" stop-color="#1B3B5B"/></linearGradient>
    <linearGradient id="paving" x2=".9" y2="1"><stop stop-color="#86A5B4"/><stop offset=".57" stop-color="#58788C"/><stop offset="1" stop-color="#4D6C84"/></linearGradient>
    <linearGradient id="cabFront" x2=".85" y2="1"><stop stop-color="#F6D7A8"/><stop offset=".24" stop-color="#CFD1B9"/><stop offset=".58" stop-color="#AFC0BE"/><stop offset="1" stop-color="#819DAA"/></linearGradient>
    <linearGradient id="cabSide" x2="1" y2=".8"><stop stop-color="#668A9E"/><stop offset="1" stop-color="#385A74"/></linearGradient>
    <linearGradient id="roof" x2="1" y2=".7"><stop stop-color="#FFF1C9"/><stop offset=".55" stop-color="#D6DDD0"/><stop offset="1" stop-color="#9EBDCB"/></linearGradient>
    <linearGradient id="door" x2="1" y2=".95"><stop stop-color="#F0D9B4"/><stop offset=".48" stop-color="#CECFBB"/><stop offset="1" stop-color="#A2B7B8"/></linearGradient>
    <linearGradient id="door2" x2="1" y2="1"><stop stop-color="#E4D5B5"/><stop offset=".6" stop-color="#BBC9BF"/><stop offset="1" stop-color="#8EA9AE"/></linearGradient>
