    <pattern id="louvres" width="17" height="5" patternUnits="userSpaceOnUse"><path d="M0 1h17" stroke="#233F50" stroke-width="1.8"/><path d="M0 2.5h17" stroke="#B0C1BC" stroke-width="1.1"/></pattern>
    <pattern id="flutes" width="7" height="8" patternUnits="userSpaceOnUse"><path d="M1 0v8" stroke="#30536D" stroke-width="1.3"/><path d="M3 0v8" stroke="#99B0B5" stroke-width=".7"/></pattern>
    <pattern id="tiles" width="49" height="27" patternUnits="userSpaceOnUse" patternTransform="matrix(.97 .35 -.8 .48 0 0)"><path d="M0 0h49v27H0z" fill="none" stroke="#A8BBC2" stroke-width="1" opacity=".65"/></pattern>
    <pattern id="grain" width="23" height="19" patternUnits="userSpaceOnUse"><path d="m2 3 2 .4m10 7 2 .7m3-6 1-.6m-11 11 .8-.6" stroke="#B1C7CD" opacity=".26" stroke-width=".8"/></pattern>
